name: Build DMG

on:
  push:
    branches: [feature/light-theme]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Use the latest available Xcode on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project smux.xcodeproj -scheme smux -clonedSourcePackagesDirPath SourcePackages

      - name: Build
        run: |
          xcodebuild -project smux.xcodeproj \
            -scheme smux \
            -configuration Release \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create DMG
        run: |
          APP_PATH="build/Build/Products/Release/smux.app"
          DMG_NAME="smux-light-theme.dmg"
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          hdiutil create -volname "smux" -srcfolder dmg_contents -ov -format UDZO "$DMG_NAME"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: smux-light-theme-dmg
          path: smux-light-theme.dmg
